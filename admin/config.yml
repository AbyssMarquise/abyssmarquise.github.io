backend:
  name: github
  repo: abyssmarquise/abyssmarquise.github.io
  branch: main
  base_url: https://camylle-portfolio-decap-auth.abyssmarquise.workers.dev
  auth_endpoint: /auth

media_folder: images
public_folder: /images

collections:
  - name: pages
    label: Pages du portfolio
    files:
      - name: accueil
        label: Accueil
        file: content/accueil.json
        format: json
        fields:
          - label: Année / mention
            name: portfolioYear
            widget: string

          - label: Titre du rôle
            name: role
            widget: string

          - label: Nom
            name: name
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Grand titre
            name: headline
            widget: string

          - label: Premier paragraphe d’introduction
            name: heroIntroOne
            widget: text

          - label: Deuxième paragraphe d’introduction
            name: heroIntroTwo
            widget: text

      - name: a-propos
        label: À propos
        file: content/a-propos.json
        format: json
        fields:
          - label: Titre
            name: aboutTitle
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Premier paragraphe
            name: aboutOne
            widget: text

          - label: Deuxième paragraphe
            name: aboutTwo
            widget: text

          - label: Troisième paragraphe
            name: aboutThree
            widget: text

      - name: presentation-projets
        label: Présentation des projets
        file: content/presentation-projets.json
        format: json
        fields:
          - label: Petit titre de section
            name: projectsLabel
            widget: string
            default: Projets

          - label: Titre principal
            name: projectsTitle
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Texte d’introduction
            name: projectsIntroduction
            widget: text
            required: false

      - name: contact
        label: Contact
        file: content/contact.json
        format: json
        fields:
          - label: Titre
            name: contactTitle
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Texte
            name: contactCopy
            widget: text

          - label: Courriel
            name: email
            widget: string

          - label: Lieu
            name: location
            widget: string

  - name: categories
    label: Catégories
    label_singular: Catégorie
    folder: content/categories
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}}"
    fields:
      - label: Verbe
        name: verb
        widget: string

      - label: Titre
        name: title
        widget: string

      - label: Domaine
        name: domain
        widget: string

      - label: Client
        name: client
        widget: string

      - label: Brief
        name: brief
        widget: text

      - label: Types de projets
        name: projectTypes
        widget: list
        field:
          label: Type de projet
          name: projectType
          widget: string

  - name: projets
    label: Projets
    label_singular: Projet
    folder: content/projets
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Catégorie et type de projet
        name: classification
        widget: category_project_type
      - label: Description
        name: description
        widget: text
      - label: Image principale
        name: image
        widget: image
        required: false
