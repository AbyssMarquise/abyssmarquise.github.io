backend:
  name: github
  repo: abyssmarquise/abyssmarquise.github.io
  branch: main
  base_url: https://REPLACE_WITH_YOUR_WORKER.workers.dev
  auth_endpoint: auth

media_folder: images
public_folder: /images

collections:
  - name: contenu
    label: Contenu du portfolio
    files:
      - name: site
        label: Textes principaux
        file: content/site.json
        format: json
        fields:
          - { label: "Année / mention", name: portfolioYear, widget: string }
          - { label: "Titre du rôle", name: role, widget: string }
          - { label: "Nom (autorise <br />)", name: name, widget: string }
          - { label: "Grand titre", name: headline, widget: string }
          - { label: "Introduction 1", name: heroIntroOne, widget: text }
          - { label: "Introduction 2", name: heroIntroTwo, widget: text }
          - { label: "Titre À propos (autorise <br />)", name: aboutTitle, widget: string }
          - { label: "À propos — paragraphe 1", name: aboutOne, widget: text }
          - { label: "À propos — paragraphe 2", name: aboutTwo, widget: text }
          - { label: "À propos — paragraphe 3", name: aboutThree, widget: text }
          - { label: "Titre contact (autorise <br />)", name: contactTitle, widget: string }
          - { label: "Texte contact", name: contactCopy, widget: text }
          - { label: Courriel, name: email, widget: string }
          - { label: Lieu, name: location, widget: string }
