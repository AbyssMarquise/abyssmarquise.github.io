backend:
  name: github
  repo: abyssmarquise/abyssmarquise.github.io
  branch: main
  base_url: https://camylle-portfolio-decap-auth.abyssmarquise.workers.dev
  auth_endpoint: /auth

media_folder: images
public_folder: /images

publish_mode: editorial_workflow

collections:
  - name: pages
    label: Pages
    files:
      - name: accueil
        label: Accueil
        file: content/accueil.json
        format: json
        fields:
          - { label: Titre du site, name: siteTitle, widget: string }
          - { label: Navigation — À propos, name: navAbout, widget: string }
          - { label: Navigation — Projets, name: navProjects, widget: string }
          - { label: Navigation — Contact, name: navContact, widget: string }
          - { label: Libellé du menu mobile, name: menuLabel, widget: string }
          - {
              label: Bouton vers les projets,
              name: projectsCta,
              widget: string,
            }
          - {
              label: Mot dans la composition visuelle,
              name: artAccent,
              widget: string,
            }
          - label: Année / mention
            name: portfolioYear
            widget: string

          - label: Titre du rôle
            name: role
            widget: string

          - label: Nom
            name: name
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Grand titre
            name: headline
            widget: string

          - label: Premier paragraphe d’introduction
            name: heroIntroOne
            widget: text

          - label: Deuxième paragraphe d’introduction
            name: heroIntroTwo
            widget: text

      - name: a-propos
        label: À propos
        file: content/a-propos.json
        format: json
        fields:
          - { label: Petit titre de section, name: aboutLabel, widget: string }
          - label: Titre
            name: aboutTitle
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Premier paragraphe
            name: aboutOne
            widget: text

          - label: Deuxième paragraphe
            name: aboutTwo
            widget: text

          - label: Troisième paragraphe
            name: aboutThree
            widget: text

          - label: Compétences principales
            name: skills
            widget: list
            field: { label: Compétence, name: skill, widget: string }

      - name: presentation-projets
        label: Projets
        file: content/presentation-projets.json
        format: json
        fields:
          - {
              label: Petit titre de section,
              name: projectsLabel,
              widget: string,
            }
          - label: Titre principal
            name: projectsTitle
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Texte d’introduction
            name: projectsIntroduction
            widget: text
            required: false

      - name: contact
        label: Contact
        file: content/contact.json
        format: json
        fields:
          - {
              label: Petit titre de section,
              name: contactLabel,
              widget: string,
            }
          - label: Titre
            name: contactTitle
            widget: string
            hint: Le champ autorise la balise <br />.

          - label: Texte
            name: contactCopy
            widget: text

          - label: Courriel
            name: email
            widget: string

          - label: Lieu
            name: location
            widget: string

          - label: Introduction du pied de page
            name: footerIntroduction
            widget: text

          - label: Titre — Navigation
            name: footerNavigationLabel
            widget: string

          - label: Titre — Contact
            name: footerContactLabel
            widget: string

          - label: Libellé — Accueil
            name: footerHome
            widget: string

          - label: URL LinkedIn
            name: linkedin
            widget: string
            required: false

          - label: Libellé LinkedIn
            name: linkedinLabel
            widget: string

          - label: URL GitHub
            name: github
            widget: string
            required: false

          - label: Libellé GitHub
            name: githubLabel
            widget: string

          - label: URL Medium
            name: medium
            widget: string
            required: false

          - label: Libellé Medium
            name: mediumLabel
            widget: string

          - label: Mention de droits d’auteur
            name: copyright
            widget: string

          - label: Libellé — Retour en haut
            name: backToTop
            widget: string

  - name: categories
    label: Catégories
    label_singular: Catégorie
    folder: content/categories
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}}"
    fields:
      - label: Verbe
        name: verb
        widget: string

      - label: Titre
        name: title
        widget: string

      - label: Description
        name: description
        widget: text

      - label: Types de projets
        name: projectTypes
        widget: list
        field:
          label: Type de projet
          name: projectType
          widget: string

  - name: projets
    label: Projets
    label_singular: Projet
    folder: content/projets
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - label: Titre
        name: title
        widget: string

      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        required: false

      - label: Catégorie et type de projet
        name: classification
        widget: category_project_type

      - label: Modèle d’affichage
        name: layout
        widget: select
        default: single
        options:
          - { label: Visuel simple, value: single }
          - { label: Deux affiches superposées, value: posters }
          - { label: Publicités dans un navigateur, value: browser }
          - { label: Support de communication, value: communication }

      - label: Domaine
        name: domain
        widget: string

      - label: Client
        name: client
        widget: string

      - label: Brief
        name: brief
        widget: text

      - label: Image du projet
        name: image
        widget: image
        required: false

      - label: Outils
        name: tools
        widget: list
        required: false
        field:
          label: Outil
          name: tool
          widget: string

      - label: Adresse affichée dans le navigateur
        name: browserAddress
        widget: string
        required: false

      - label: Nom du média dans le navigateur
        name: browserLogo
        widget: string
        required: false

      - label: Rubrique affichée dans le navigateur
        name: browserCategory
        widget: string
        required: false
