backend:
  name: github
  repo: abyssmarquise/abyssmarquise.github.io
  branch: main
  base_url: https://camylle-portfolio-decap-auth.abyssmarquise.workers.dev
  auth_endpoint: /auth

media_folder: images
public_folder: /images

collections:
  - name: contenu
    label: Contenu du portfolio
    files:
      - name: site
        label: Textes principaux
        file: content/site.json
        format: json
        fields:
          - label: Année / mention
            name: portfolioYear
            widget: string
          - label: Titre du rôle
            name: role
            widget: string
          - label: Nom (autorise <br />)
            name: name
            widget: string
          - label: Grand titre
            name: headline
            widget: string
          - label: Introduction 1
            name: heroIntroOne
            widget: text
          - label: Introduction 2
            name: heroIntroTwo
            widget: text
          - label: Titre À propos (autorise <br />)
            name: aboutTitle
            widget: string
          - label: À propos — paragraphe 1
            name: aboutOne
            widget: text
          - label: À propos — paragraphe 2
            name: aboutTwo
            widget: text
          - label: À propos — paragraphe 3
            name: aboutThree
            widget: text
          - label: Titre contact (autorise <br />)
            name: contactTitle
            widget: string
          - label: Texte contact
            name: contactCopy
            widget: text
          - label: Courriel
            name: email
            widget: string
          - label: Lieu
            name: location
            widget: string

  - name: categories
    label: Catégories
    label_singular: Catégorie
    folder: content/categories
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    summary: "{{title}}"
    fields:
      - label: Verbe
        name: verb
        widget: string

      - label: Titre
        name: title
        widget: string

      - label: Domaine
        name: Domain
        widget: string

      - label: Client
        name: client
        widget: string

      - label: Brief
        name: brief
        widget: text

      - label: Types de projets
        name: projectTypes
        widget: list
        field:
          label: Type de projet
          name: projectType
          widget: string

  - name: projets
    label: Projets
    label_singular: Projet
    folder: content/projets
    create: true
    slug: "{{slug}}"
    extension: json
    format: json
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Catégorie et type de projet
        name: classification
        widget: category_project_type
      - label: Description
        name: description
        widget: text
      - label: Image principale
        name: image
        widget: image
        required: false
