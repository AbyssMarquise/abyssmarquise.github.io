<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#102f32">
    <title>Site web en construction</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: #102f32; color: #f5efe5; font-family: Georgia, 'Times New Roman', serif; text-align: center; }
      main { max-width: 42rem; }
      .line { display: block; width: 3rem; height: 2px; background: #d9b98a; margin: 0 auto 2rem; }
      h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 400; line-height: 1.12; margin: 0 0 1.5rem; text-wrap: balance; }
      p { margin: 0; color: #d1dcd8; font: 1.05rem/1.7 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <span class="line" aria-hidden="true"></span>
      <h1>Site web en construction</h1>
      <p>Mon portfolio fait peau neuve.<br>Merci de votre patience et à bientôt.</p>
    </main>
  </body>
</html>
