<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="title desc">
  <title id="title">Monogramme secondaire Camylle Michaud</title>
  <desc id="desc">Lettres C et M entrelacées accompagnées d'une branche botanique fine.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&amp;display=swap');

      .monogram {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 400;
        fill: #a89b8c;
      }

      .botanical {
        fill: none;
        stroke: #a89b8c;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .leaf {
        fill: none;
        stroke: #a89b8c;
        stroke-width: 1.8;
      }
    </style>
  </defs>

  <!-- Monogramme -->
  <text class="monogram" x="58" y="142" font-size="132">C</text>
  <text class="monogram" x="127" y="176" font-size="132">M</text>

  <!-- Branche botanique -->
  <g transform="translate(238 72) rotate(5)">
    <path class="botanical" d="M0 93 C13 72, 17 47, 24 4" />
    <path class="botanical" d="M10 72 C-1 63, -8 54, -12 44" />
    <path class="botanical" d="M15 58 C27 50, 33 40, 37 29" />
    <path class="botanical" d="M19 42 C9 34, 4 25, 2 16" />
    <path class="botanical" d="M22 25 C31 19, 37 11, 40 3" />

    <ellipse class="leaf" cx="-14" cy="41" rx="4.5" ry="9" transform="rotate(-43 -14 41)" />
    <ellipse class="leaf" cx="-6" cy="53" rx="4.5" ry="9" transform="rotate(-47 -6 53)" />
    <ellipse class="leaf" cx="34" cy="27" rx="4.5" ry="9" transform="rotate(42 34 27)" />
    <ellipse class="leaf" cx="27" cy="39" rx="4.5" ry="9" transform="rotate(39 27 39)" />
    <ellipse class="leaf" cx="0" cy="14" rx="4.5" ry="9" transform="rotate(-42 0 14)" />
    <ellipse class="leaf" cx="39" cy="2" rx="4.5" ry="9" transform="rotate(38 39 2)" />

    <circle cx="24" cy="4" r="2.8" fill="#a89b8c" />
    <circle cx="40" cy="3" r="2.3" fill="#a89b8c" />
    <circle cx="-12" cy="44" r="2.2" fill="#a89b8c" />
  </g>
</svg>
